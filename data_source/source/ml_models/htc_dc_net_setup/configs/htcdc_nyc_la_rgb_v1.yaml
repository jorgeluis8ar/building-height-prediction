## HTC-DC Net model/training configuration for local smoke tests

model: htcdc
backbone: efficientnetb0
project: HTCDC_NYC_LA_RGB_V1

batch_size: 1
num_workers: 0

max_epochs: 1
lr: 0.0001
chamfer_weight: 0.01
log_interval: 1

optimizer: AdamW

early_stopping:
  - mae
  - rmse
  - val/loss_total
early_stopping_mode:
  - min
  - min
  - min
